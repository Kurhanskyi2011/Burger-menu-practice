<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="nav-wrapper">
        <div class="container">
            <nav class="nav">
                <div class="nav-location">
                    <p class="nav-location-item">Буча</p>
                </div>
                <div class="nav-logo">
                    <img src="./osama-com-ua-logo.png" alt="osama.com.ua logo" class="nav-logo-item"/>
                    <h3 class="nav-logo-title">OSAMA</h3>
                </div>
                <div class="nav-actions">
                    <button class="nav-actions-item">
                        <img src="./search.png" alt="" class="nav-actions-item-logo">
                    </button>
                    <button class="nav-actions-item">
                        <img src="./shopping-cart.png" alt="" class="nav-actions-item-logo">
                    </button>
                    <button class="nav-actions-item">Вхід</button>
                    <button class="nav-actions-item">
                        <div class="nav-actions-item-line"></div>
                        <div class="nav-actions-item-line"></div>
                        <div class="nav-actions-item-line"></div>
                    </button>
                </div>
            </nav>
        </div>
    </div>
    <div class="burger-menu">
    <div class="burger-menu-container">
        

        <div class="burger-menu-header">
            <div class="burger-menu-location">Буча</div>
            <div class="burger-menu-nav-right">
                <div class="burger-menu-lang">UA <span class="arrow">˅</span></div>
                <button class="burger-menu-cart-btn">
                    <img src="./shopping-cart.png" alt="Cart" class="burger-menu-cart-icon">
                </button>
                <button class="lightbox-close">+</button>
            </div>
        </div>
        <ul class="burger-menu-links">
            <li>Меню</li>
            <li>Особистий кабінет</li>
            <li>Про нас</li>
            <li>Акції</li>
            <li>Наші заклади доставки</li>
            <li>Умови доставки</li>
            <li>Відгуки</li>
            <li>Повернення та обмін</li>
        </ul>

    </div>
</div>
    <script src="./script.js"></script>
</body>
</html>
